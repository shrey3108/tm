[project]
name = "github-code-evaluator"
version = "0.1.0"
description = "GitHub Code Evaluator - FastAPI + Celery application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "celery>=5.4",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "redis>=5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "litellm>=1.50",
    "uuid6>=2024.7.1",
    "nest-asyncio>=1.6.0",
    "pyjwt[crypto]>=2.9.0",
    "gitingest>=0.1.3",
    "bandit>=1.8.0",
    "arize-phoenix",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["github_code_evaluator"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]