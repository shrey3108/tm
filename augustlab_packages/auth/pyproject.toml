[project]
name = "augustlab-packages"
version = "0.1.0"
description = "Reusable authentication and core backend packages by AugustLab"
readme = "README.md"
requires-python = "~=3.12.0"

dependencies = [
    "alembic>=1.18.1",
    "asgi-lifespan>=2.1.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "cryptography>=46.0.3",
    "email-validator>=2.3.0",
    "fastapi>=0.128.0",
    "fastapi-users>=15.0.3",
    "fastapi-users-db-sqlalchemy>=7.0.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "limits>=5.7.0",
    "psycopg[binary]>=3.3.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.2",
    "python-jose>=3.5.0",
    "redis>=7.1.0",
    "requests>=2.32.5",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.46",
    "uuid-utils>=0.14.0",
    "uvicorn[standard]>=0.40.0",
    "python-json-logger>=2.0.7",
    "bleach>=6.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 👇 THIS IS THE IMPORTANT FIX
[tool.hatch.build.targets.wheel]
packages = ["v1"]
